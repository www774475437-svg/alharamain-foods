name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: twa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Android SDK for Bubblewrap
        run: |
          SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;36.1.0"
          # Bubblewrap expects the legacy layout: <sdk>/tools/bin/sdkmanager must exist.
          CMD_ROOT=$(dirname "$(dirname "$SDKM")")
          if [ ! -e "$ANDROID_HOME/tools" ]; then ln -s "$CMD_ROOT" "$ANDROID_HOME/tools"; fi

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
            PW="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No KEYSTORE secrets set. A temporary key is used, so updates will not install over this APK."
            PW=$(openssl rand -base64 18 | tr -d '/+=')
            keytool -genkeypair -v -keystore android.keystore -storepass "$PW" -keypass "$PW" \
              -alias alharamain -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Al-Haramain Foods, O=Al-Haramain, C=US"
          fi
          echo "::add-mask::$PW"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          # Point Bubblewrap at the preinstalled JDK and SDK so it never asks to install them.
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alharamain-foods-apk
          path: twa/app-release-signed.apk
          if-no-files-found: error
