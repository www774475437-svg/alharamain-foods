<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Haramain International Foods | الحرمين للأغذية العالمية</title>
<meta name="description" content="Al-Haramain International Foods — 4 stores in Hamtramck, Farmington and Farmington Hills, Michigan. Shop 2,500+ international products.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.wixstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top" id="top">
    <div class="top-row">
      <a class="brand" href="#/">
        <img id="logo" alt="Al-Haramain International">
        <span><b id="brandName"></b><small id="brandSub"></small></span>
      </a>
      <div class="top-actions">
        <a class="lang icon" id="accBtn" href="#/acc" aria-label="Account">👤</a>
        <button class="lang" id="langBtn"></button>
        <a class="lang" id="devBtn" href="#/acc" hidden></a>
      </div>
    </div>
    <button class="branch-pill" id="branchBtn">
      <span class="pin">📍</span>
      <span class="bp-text"><small id="bpLabel"></small><b id="bpName"></b></span>
      <span class="chev">▾</span>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
      <button type="button" id="qClear" hidden>✕</button>
    </label>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="home"></span></a>
    <a href="#/cats" data-tab="cats"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span data-t="cats"></span></a>
    <a href="#/cart" class="fab" data-tab="cart" aria-label="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><i id="cartBadge" hidden></i></a>
    <a href="#/fav" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-t="fav"></span></a>
    <a href="#/stores" data-tab="stores"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg><span data-t="stores"></span></a>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true"><div class="grab"></div><div id="sheetBody"></div></section>
<div class="toast" id="toast"></div>

<script src="branches.js"></script>
<script src="app.js"></script>
<script type="module" src="admin.js"></script>
<script type="module" src="ai.js"></script>
</body>
</html>
